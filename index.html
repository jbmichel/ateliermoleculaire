<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atelier Moléculaire</title>
<meta name="description" content="AI and molecular design for beauty brands.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Geist+Mono:wght@400&display=swap">
<style>
/* Layout: one screen of lab-notebook grid. The name is drawn on a canvas so each letter can unfold into its amino acid and be pulled into a peptide chain. Single-theme: white and black. */
* { box-sizing: border-box; }
:root {
  --paper: #ffffff;
  --ink: #0b0b0b;
  --grey: #4a4a4a;
  --soft: #8a8a8a;
  --faint: #b4b4b4;
  --grid: rgba(11, 11, 11, .05);
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased;
  touch-action: none; -webkit-user-select: none; user-select: none;
}

.grid {
  position: fixed; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px; background-position: -1px -1px;
}
.cross { position: fixed; width: 14px; height: 14px; pointer-events: none; }
.cross::before, .cross::after { content: ""; position: absolute; background: var(--ink); }
.cross::before { left: 6px; top: 0; width: 1px; height: 14px; }
.cross::after { top: 6px; left: 0; height: 1px; width: 14px; }
.c1 { top: calc(20px + env(safe-area-inset-top, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); }
.c2 { top: calc(20px + env(safe-area-inset-top, 0px)); right: calc(20px + env(safe-area-inset-right, 0px)); }
.c3 { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); left: calc(20px + env(safe-area-inset-left, 0px)); }
.c4 { bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: calc(20px + env(safe-area-inset-right, 0px)); }

#stage { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

.page {
  position: relative; min-height: 100%;
  display: grid; grid-template-rows: 1fr auto;
  padding-left: max(clamp(28px, 7vw, 96px), env(safe-area-inset-left, 0px));
  padding-right: max(clamp(28px, 7vw, 96px), env(safe-area-inset-right, 0px));
  padding-block: clamp(40px, 7vw, 88px);
}
main { position: relative; align-self: center; display: grid; gap: 24px; padding-block: 48px; }
h1 { font: 400 clamp(44px, 9vw, 128px)/.95 var(--sans); letter-spacing: -.045em; margin: 0; }
h1 .word { display: block; }
.live h1 { color: transparent; }
.tag { font: 400 clamp(13px, 1.3vw, 15px)/1.5 var(--mono); letter-spacing: .02em; color: var(--grey); margin: 0; max-width: 40ch; }

footer {
  position: relative; z-index: 2;
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: end; gap: 24px;
  font: 400 12px/1 var(--mono); letter-spacing: .04em;
}
.contact {
  color: var(--ink); text-decoration: none; text-transform: uppercase; letter-spacing: .1em;
  padding: 6px 0; background: none; border: 0; font: inherit; cursor: pointer;
}
.contact::before { content: "[ "; color: #9a9a9a; transition: margin .2s; }
.contact::after { content: " ]"; color: #9a9a9a; transition: margin .2s; }
.contact:hover::before { margin-right: 6px; }
.contact:hover::after { margin-left: 6px; }
.contact:focus-visible { outline: 1px solid var(--ink); outline-offset: 4px; }
.seq { justify-self: center; text-align: center; line-height: 1.6; color: var(--faint); letter-spacing: .06em; min-width: 0; }
.right { justify-self: end; display: flex; align-items: end; gap: 20px; }
.scale { display: flex; align-items: center; gap: 8px; color: #6a6a6a; padding: 6px 0; white-space: nowrap; }
.scale i { display: block; width: 60px; height: 6px; border: 1px solid var(--ink); border-top: 0; transition: width .3s; }

@media (max-width: 760px) {
  .seq { display: none; }
}
@media (max-width: 480px) { .scale { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .contact::before, .contact::after, .scale i { transition: none; }
}
</style>
</head>
<body>

<div class="grid" aria-hidden="true"></div>
<span class="cross c1" aria-hidden="true"></span>
<span class="cross c2" aria-hidden="true"></span>
<span class="cross c3" aria-hidden="true"></span>
<span class="cross c4" aria-hidden="true"></span>
<canvas id="stage" aria-hidden="true"></canvas>

<div class="page">
  <main>
    <h1 id="name"><span class="word">Atelier</span><span class="word">Moléculaire</span></h1>
    <p class="tag">AI and molecular design for beauty brands.</p>
  </main>
  <footer>
    <a class="contact" href="mailto:hello@ateliermoleculaire.com">Contact us</a>
    <span class="seq" id="seq" aria-hidden="true"></span>
    <span class="right">
      <span class="scale" id="scale" aria-hidden="true"><i></i>1 nm</span>
    </span>
  </footer>
</div>

<script>
(() => {
  // Every letter of the name is a one-letter amino acid code,
  // including O (pyrrolysine) and U (selenocysteine).
  const AA = { A:'Ala', R:'Arg', N:'Asn', D:'Asp', C:'Cys', Q:'Gln', E:'Glu', G:'Gly', H:'His', I:'Ile',
               L:'Leu', K:'Lys', M:'Met', F:'Phe', P:'Pro', S:'Ser', T:'Thr', W:'Trp', Y:'Tyr', V:'Val',
               O:'Pyl', U:'Sec' };

  // Physical scale. Consecutive alpha carbons sit 3.8 Å apart along a peptide;
  // a C–C bond is 1.54 Å. Side-chain bonds below are drawn 0.96 units long.
  const CA_CA = 3.8, CC = 1.54, BOND_UNITS = 0.96;
  const U_PER_L = CC / (CA_CA * BOND_UNITS);   // side-chain unit as a fraction of residue spacing
  const NM_PER_L = CA_CA / 10;                 // residue spacing in nanometres

  // Side chains as small skeletal drawings. Local units: x along the backbone,
  // y pointing away from it; atom 0 is the alpha carbon.
  const SC = (() => {
    const Z = k => [k % 2 ? 0.45 : 0, k * 0.85];
    const mk = f => {
      const a = [{ x: 0, y: 0 }], b = [];
      const add = (x, y, l, from = a.length - 1, d = 0) => { a.push({ x, y, l }); b.push([from, a.length - 1, d]); return a.length - 1; };
      const z = (k, l, from, d) => add(Z(k)[0], Z(k)[1], l, from, d);
      const ring = (from, n, cx, cy, r, labels = {}, dbl = []) => {
        const ids = [];
        for (let k = 0; k < n; k++) {
          const ang = -Math.PI / 2 + k * 2 * Math.PI / n;
          ids.push(a.length); a.push({ x: cx + r * Math.cos(ang), y: cy + r * Math.sin(ang), l: labels[k] });
        }
        b.push([from, ids[0], 0]);
        for (let k = 0; k < n; k++) b.push([ids[k], ids[(k + 1) % n], dbl.includes(k) ? 1 : 0, cx, cy]);
        return ids;
      };
      f({ add, z, ring, a, b });
      return { a, b };
    };
    const acid = (k, tail) => ({ z, add }) => {
      for (let i = 1; i < k; i++) z(i);
      const c = z(k), [cx, cy] = Z(k);
      add(cx - 0.6, cy + 0.7, 'O', c, 1);
      add(cx + 0.65, cy + 0.55, tail, c);
    };
    return {
      G: mk(({ add }) => add(0, 0.75, 'H')),
      A: mk(({ z }) => z(1)),
      S: mk(({ z }) => { z(1); z(2, 'OH'); }),
      C: mk(({ z }) => { z(1); z(2, 'SH'); }),
      U: mk(({ z }) => { z(1); z(2, 'SeH'); }),
      T: mk(({ add }) => { const c = add(0, 0.9); add(-0.75, 1.4, 'OH', c); add(0.75, 1.4, null, c); }),
      V: mk(({ add }) => { const c = add(0, 0.9); add(-0.75, 1.4, null, c); add(0.75, 1.4, null, c); }),
      L: mk(({ z, add }) => { z(1); const c = z(2); add(-0.45, 2.55, null, c); add(0.75, 2.2, null, c); }),
      I: mk(({ add }) => { const c = add(0, 0.9); add(-0.75, 1.4, null, c); const g = add(0.75, 1.4, null, c); add(0.75, 2.35, null, g); }),
      M: mk(({ z }) => { z(1); z(2); z(3, 'S'); z(4); }),
      D: mk(acid(2, 'O⁻')),
      N: mk(acid(2, 'NH₂')),
      E: mk(acid(3, 'O⁻')),
      Q: mk(acid(3, 'NH₂')),
      K: mk(({ z }) => { z(1); z(2); z(3); z(4); z(5, 'NH₃⁺'); }),
      R: mk(({ z, add }) => { z(1); z(2); z(3); z(4, 'NH'); const c = z(5); add(-0.15, 5.0, 'NH₂', c); add(1.2, 4.7, 'NH₂⁺', c, 1); }),
      F: mk(({ z, ring }) => { const cb = z(1); ring(cb, 6, 0.45, 2.6, 0.85, {}, [1, 3, 5]); }),
      Y: mk(({ z, ring, add }) => { const cb = z(1); const r = ring(cb, 6, 0.45, 2.6, 0.85, {}, [1, 3, 5]); add(0.45, 4.3, 'OH', r[3]); }),
      H: mk(({ z, ring }) => { const cb = z(1); ring(cb, 5, 0.45, 2.47, 0.72, { 2: 'N', 4: 'NH' }, [0, 2]); }),
      W: mk(({ z, ring, a, b }) => {
        const cb = z(1), cx = 0.45, cy = 2.47;
        const p = ring(cb, 5, cx, cy, 0.72, { 2: 'NH' }, [0]);
        const P = a[p[3]], Q = a[p[4]];
        const mx = (P.x + Q.x) / 2, my = (P.y + Q.y) / 2;
        let ox = mx - cx, oy = my - cy; const ol = Math.hypot(ox, oy); ox /= ol; oy /= ol;
        const s = Math.hypot(P.x - Q.x, P.y - Q.y), hx = mx + ox * s * Math.sqrt(3) / 2, hy = my + oy * s * Math.sqrt(3) / 2;
        const aP = Math.atan2(P.y - hy, P.x - hx), aQ = Math.atan2(Q.y - hy, Q.x - hx);
        const dir = ((aQ - aP + 3 * Math.PI) % (2 * Math.PI) - Math.PI) > 0 ? 1 : -1;
        let prev = p[4];
        for (let k = 1; k <= 4; k++) {
          const ang = aQ + dir * k * Math.PI / 3, id = a.length;
          a.push({ x: hx + s * Math.cos(ang), y: hy + s * Math.sin(ang) });
          b.push([prev, id, k % 2, hx, hy]); prev = id;
        }
        b.push([prev, p[3], 0, hx, hy]);
      }),
      P: mk(({ add, b }) => { add(0.45, 0.85); add(-0.1, 1.55); const d = add(-0.85, 1.05); const n = add(-0.85, 0.15, null, d); b.push([n, 0, 0]); }),
      O: mk(({ z, add, ring }) => {
        z(1); z(2); z(3); z(4); z(5, 'NH'); const c = z(6);
        add(-0.6, 5.75, 'O', c, 1);
        ring(c, 5, 0.55, 6.47, 0.62, { 1: 'N' }, [0]);
      }),
    };
  })();

  const doc = document.documentElement;
  const cv = document.getElementById('stage'), ctx = cv.getContext('2d');
  const h1 = document.getElementById('name');
  const seqEl = document.getElementById('seq'), scaleBar = document.querySelector('#scale i');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const css = getComputedStyle(doc);
  const INK = css.getPropertyValue('--ink').trim(), PAPER = css.getPropertyValue('--paper').trim();
  const SOFT = css.getPropertyValue('--soft').trim();
  const MONO = css.getPropertyValue('--mono').trim();

  // Node modes: 'home' = letter set in the name; 'res' = amino acid in the liquid.
  const nodes = [];
  h1.querySelectorAll('.word').forEach(w => {
    const txt = w.textContent; w.textContent = '';
    for (const ch of txt) {
      const s = document.createElement('span'); s.textContent = ch; w.appendChild(s);
      const code = ch.normalize('NFD')[0].toUpperCase();
      nodes.push({ el: s, ch, code, mode: 'home', p: { x: 0, y: 0 }, q: { x: 0, y: 0 }, home: { x: 0, y: 0 },
                   rect: null, t: 0, dx: 0, dy: 0, popAt: -1e9 });
    }
  });
  const N = nodes.length;
  const links = nodes.slice(1).map(() => ({ homeDist: 0, rest: 0 }));

  seqEl.innerHTML = 'H₂N–' + nodes.map(n => `<span>${n.code}</span>`).join('–') + '–COOH';
  const seqSpans = [...seqEl.querySelectorAll('span')];

  let W = 0, H = 0, fs = 64, L = 32, u = 10, font = '', LABEL = '', LABEL_PX = 10;
  function layout() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cs = getComputedStyle(h1);
    fs = parseFloat(cs.fontSize);
    font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    ctx.font = font;
    const m = ctx.measureText('Hg');
    const asc = m.fontBoundingBoxAscent || fs * 0.93;
    L = Math.max(fs * 0.62, 38);
    u = L * U_PER_L;
    LABEL_PX = Math.max(9, Math.min(12, Math.round(u * 0.36)));
    LABEL = `${LABEL_PX}px ${MONO}`;
    scaleBar.style.width = Math.round(L / NM_PER_L) + 'px';   // 1 nm at the drawing's scale
    nodes.forEach(n => {
      const r = n.el.getBoundingClientRect();
      n.rect = r;
      n.home = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      n.dx = r.left - n.home.x; n.dy = r.top + asc - n.home.y;
      if (n.mode === 'home') { n.p = { ...n.home }; n.q = { ...n.home }; }
    });
    links.forEach((lk, i) => {
      const a = nodes[i], b = nodes[i + 1];
      lk.homeDist = Math.hypot(a.home.x - b.home.x, a.home.y - b.home.y);
      if (a.mode === 'home' || b.mode === 'home') lk.rest = lk.homeDist;
    });
  }

  // Interaction state
  let hover = -1, hoverStart = 0, drag = -1, reforming = false;
  // Returning home: after a quiet moment the chain is drawn back to the name (homing 0..1);
  // once it has settled there, residues pop back into letters one at a time.
  let lastActivity = 0, homing = 0, settledAt = 0, popQueue = null, nextPop = 0;
  const ptr = { x: -1e4, y: -1e4 };
  const DWELL = 650;
  // Idle fidgets: when the name has rested untouched for a while, a letter stirs now and then,
  // or a slow ripple runs along the word like a strand flexing, inviting a hover or a pull.
  // The first one comes sooner, right after the page loads.
  const IDLE_BEFORE_FIDGET = 1200, FIRST_FIDGET = 500;
  let fidgeted = false;
  let lastPointer = 0, restingSince = 0, fidget = null, nextFidget = 0;
  // Tease: after a longer while with no hover or click on a letter, a letter turns into its
  // amino acid by itself, sometimes followed by a few neighbours; the usual return brings them back.
  const IDLE_BEFORE_TEASE = 1500, FIRST_TEASE = 1500;
  let teased = false;
  let lastLetterTouch = 0, teaseQueue = null, nextTease = 0;
  const IDLE_BEFORE_RETURN = 2200, IDLE_BEFORE_RETURN_CHAIN = 4500, RETURN_RAMP = 4000, PAUSE_BEFORE_POP = 900;

  function syncUI() {
    const anyRes = nodes.some(n => n.mode === 'res');
    nodes.forEach((n, i) => {
      const s = seqSpans[i], txt = n.mode === 'res' ? AA[n.code] : n.code;
      if (s.textContent !== txt) { s.textContent = txt; s.style.color = n.mode === 'res' ? INK : ''; }
    });
  }
  function toResidue(i) {
    const n = nodes[i];
    if (!n || n.mode === 'res') return;
    n.q = { ...n.p };
    n.mode = 'res';
    lastActivity = performance.now(); popQueue = null; settledAt = 0;
    syncUI();
  }
  function toLetter(i, time) {
    const n = nodes[i];
    if (n.mode === 'home') return;
    n.mode = 'home'; n.popAt = time;
    if (i > 0) links[i - 1].rest = links[i - 1].homeDist;
    if (i < N - 1) links[i].rest = links[i].homeDist;
    syncUI();
  }

  function hit(x, y) {
    let best = -1, bd = Infinity;
    nodes.forEach((n, i) => {
      if (n.mode !== 'res') return;
      const d = Math.hypot(n.p.x - x, n.p.y - y);
      if (d < L * 0.6 && d < bd) { bd = d; best = i; }
    });
    if (best >= 0) return best;
    for (let i = 0; i < N; i++) {
      const n = nodes[i], r = n.rect;
      if (n.mode === 'home' && n.t < 0.5 && r && x >= r.left && x <= r.right && y >= r.top + r.height * 0.12 && y <= r.bottom - r.height * 0.1) return i;
    }
    return -1;
  }

  addEventListener('pointermove', e => {
    ptr.x = e.clientX; ptr.y = e.clientY; lastPointer = performance.now();
    if (drag >= 0) return;
    const i = hit(ptr.x, ptr.y);
    if (i >= 0 && nodes[i].mode === 'home' && e.pointerType === 'mouse') {
      if (hover !== i) { hover = i; hoverStart = lastLetterTouch = performance.now(); teaseQueue = null; }
    } else hover = -1;
    document.body.style.cursor = i < 0 ? '' : nodes[i].mode === 'home' ? 'crosshair' : 'grab';
  });
  addEventListener('pointerdown', e => {
    if (e.target.closest('a, button')) return;
    ptr.x = e.clientX; ptr.y = e.clientY;
    const i = hit(ptr.x, ptr.y);
    if (i < 0) return;
    e.preventDefault();
    reforming = false; popQueue = null; settledAt = 0; teaseQueue = null;
    lastLetterTouch = performance.now();
    toResidue(i);
    drag = i; hover = -1;
    document.body.style.cursor = 'grabbing';
  });
  const release = () => {
    if (drag < 0) return;
    drag = -1; lastActivity = performance.now();
    document.body.style.cursor = '';
  };
  addEventListener('pointerup', release);
  addEventListener('pointercancel', release);
  document.addEventListener('pointerleave', () => { hover = -1; });

  // Physics: Verlet nodes in a viscous liquid.
  const DAMP = 0.925;
  const ease = t => t * t * (3 - 2 * t);
  function relax(a, b, rest, k) {
    const dx = b.p.x - a.p.x, dy = b.p.y - a.p.y, d = Math.hypot(dx, dy) || 1e-6;
    const wa = a === nodes[drag] ? 0 : 1, wb = b === nodes[drag] ? 0 : 1;
    if (wa + wb === 0) return;
    const f = (d - rest) / d * k / (wa + wb);
    a.p.x += dx * f * wa; a.p.y += dy * f * wa;
    b.p.x -= dx * f * wb; b.p.y -= dy * f * wb;
  }

  function startPopping(time, delay) {
    // Shuffle so the letters come back in an irregular order.
    popQueue = nodes.map((n, i) => i).filter(i => nodes[i].mode === 'res');
    for (let k = popQueue.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [popQueue[k], popQueue[j]] = [popQueue[j], popQueue[k]]; }
    nextPop = time + delay;
  }

  function step(time) {
    const anyRes = nodes.some(n => n.mode === 'res');
    const idle = !reforming && drag < 0 && anyRes;
    const allRes = nodes.every(n => n.mode === 'res');
    const wait = allRes ? IDLE_BEFORE_RETURN_CHAIN : IDLE_BEFORE_RETURN;
    const want = idle ? Math.min(1, Math.max(0, (time - lastActivity - wait) / RETURN_RAMP)) : 0;
    homing += (want - homing) * (want > homing ? 1 : 0.2);
    if (!anyRes) homing = 0;
    const pull = 0.011 * ease(homing);

    nodes.forEach((n, i) => {
      if (n.mode === 'home') { n.p.x = n.home.x; n.p.y = n.home.y; n.q.x = n.p.x; n.q.y = n.p.y; return; }
      let vx = (n.p.x - n.q.x) * DAMP, vy = (n.p.y - n.q.y) * DAMP;
      n.q.x = n.p.x; n.q.y = n.p.y;
      if (!reduce && !reforming) {
        const calm = 1 - homing;
        vx += Math.sin(time * 0.0006 + i * 1.7) * L * 0.0009 * calm;
        vy += Math.cos(time * 0.0005 + i * 2.3) * L * 0.0009 * calm;
        // A slow wave travels along the strand, pushing across it, so the chain keeps writhing.
        const a = nodes[i - 1], b = nodes[i + 1];
        if (a && b && a.mode === 'res' && b.mode === 'res') {
          const tx = b.p.x - a.p.x, ty = b.p.y - a.p.y, tl = Math.hypot(tx, ty) || 1;
          const w = (Math.sin(time * 0.0017 - i * 0.65) + 0.5 * Math.sin(time * 0.0011 + i * 0.4)) * L * 0.0011 * calm;
          vx += -ty / tl * w; vy += tx / tl * w;
        }
      }
      if (pull) { vx += (n.home.x - n.p.x) * pull; vy += (n.home.y - n.p.y) * pull; }
      n.p.x += vx; n.p.y += vy;
    });

    if (reforming) {
      let done = true;
      nodes.forEach(n => {
        if (n.mode === 'home') return;
        n.p.x += (n.home.x - n.p.x) * 0.09; n.p.y += (n.home.y - n.p.y) * 0.09;
        if (Math.hypot(n.home.x - n.p.x, n.home.y - n.p.y) > 1.5) done = false;
      });
      if (done) {
        reforming = false;
        lastActivity = -1e9; homing = 1;          // keep them held in place while they pop
        startPopping(time, 150);
      }
    } else {
      if (drag >= 0) { const n = nodes[drag]; n.p.x += (ptr.x - n.p.x) * 0.55; n.p.y += (ptr.y - n.p.y) * 0.55; }

      // Bond lengths relax from the peptide spacing back to the letter spacing as the chain returns.
      links.forEach((lk, i) => {
        if (nodes[i].mode === 'res' && nodes[i + 1].mode === 'res') lk.rest += (L + (lk.homeDist - L) * homing - lk.rest) * 0.04;
      });

      const loosen = 1 - homing;
      for (let it = 0; it < 8; it++) {
        for (let i = 0; i < links.length; i++) {
          const a = nodes[i], b = nodes[i + 1], lk = links[i];
          const ra = a.mode === 'res', rb = b.mode === 'res';
          if (ra && rb) relax(a, b, lk.rest, 0.55);
          else if (ra !== rb) {
            // A residue still bonded to a letter in the name: it holds, then peels.
            const c = ra ? a : b, o = ra ? b : a;
            const d = Math.hypot(c.p.x - o.p.x, c.p.y - o.p.y);
            if (d > lk.homeDist + L * 0.85 && homing < 0.5) { toResidue(nodes.indexOf(o)); lk.rest = d; }
            else if (d > lk.homeDist && c !== nodes[drag]) {
              const f = (d - lk.homeDist) / d * 0.05;
              c.p.x += (o.p.x - c.p.x) * f; c.p.y += (o.p.y - c.p.y) * f;
            }
          }
        }
        // Bending stiffness: the strand curls instead of folding flat. It eases off on the way home,
        // where the name's line break needs a sharp turn.
        if (loosen > 0) for (let i = 1; i < N - 1; i++) {
          const a = nodes[i - 1], m = nodes[i], b = nodes[i + 1];
          if (a.mode !== 'res' || m.mode !== 'res' || b.mode !== 'res') continue;
          const minD = (links[i - 1].rest + links[i].rest) * 0.68;
          const d = Math.hypot(a.p.x - b.p.x, a.p.y - b.p.y);
          if (d < minD) relax(a, b, minD, 0.06 * loosen);
        }
      }
      // Excluded volume between residues that are not neighbours.
      for (let i = 0; i < N; i++) for (let j = i + 2; j < N; j++) {
        const a = nodes[i], b = nodes[j];
        if (a.mode !== 'res' || b.mode !== 'res') continue;
        const d = Math.hypot(a.p.x - b.p.x, a.p.y - b.p.y);
        if (d < L) relax(a, b, L, 0.3 * loosen);
      }
      // Soft walls.
      const m = L * 0.7;
      nodes.forEach(n => {
        if (n.mode !== 'res' || n === nodes[drag]) return;
        if (n.p.x < m) n.p.x += (m - n.p.x) * 0.2;
        if (n.p.x > W - m) n.p.x -= (n.p.x - (W - m)) * 0.2;
        if (n.p.y < m) n.p.y += (m - n.p.y) * 0.2;
        if (n.p.y > H - m) n.p.y -= (n.p.y - (H - m)) * 0.2;
      });

      // Back in place: wait a moment, then let residues pop back into letters, one by one.
      if (!popQueue && homing > 0.97) {
        const settled = nodes.every(n => n.mode === 'home' ||
          (Math.hypot(n.home.x - n.p.x, n.home.y - n.p.y) < 2 && Math.hypot(n.p.x - n.q.x, n.p.y - n.q.y) < 0.2));
        if (settled && !settledAt) settledAt = time;
        if (!settled) settledAt = 0;
        if (settledAt && time - settledAt > PAUSE_BEFORE_POP) startPopping(time, 0);
      }
      if (popQueue) {
        while (popQueue.length && time >= nextPop) {
          toLetter(popQueue.shift(), time);
          nextPop = time + 60 + Math.random() * 200;
        }
        if (!popQueue.length) { popQueue = null; settledAt = 0; }
      }
    }

    nodes.forEach(n => { n.t += ((n.mode === 'res' && !reforming ? 1 : 0) - n.t) * (reduce ? 0.3 : n.mode === 'home' ? 0.11 : 0.075); });

    if (hover >= 0 && drag < 0 && nodes[hover].mode === 'home' && time - hoverStart >= DWELL) { toResidue(hover); hover = -1; }

    // Idle fidgets, only while every letter is at rest in the name.
    const resting = drag < 0 && hover < 0 && !reforming && nodes.every(n => n.mode === 'home' && n.t < 0.02);
    if (!resting) restingSince = 0;
    else if (!restingSince) restingSince = time;
    if (fidget && time - fidget.start > fidget.dur) fidget = null;
    if (!reduce && resting && !fidget && time - Math.max(restingSince, lastPointer) > (fidgeted ? IDLE_BEFORE_FIDGET : FIRST_FIDGET) && time >= nextFidget) {
      fidgeted = true;
      fidget = Math.random() < 0.35
        ? { type: 'ripple', start: time, dur: 2400, dir: Math.random() < 0.5 ? 1 : -1 }
        : { type: 'stir', start: time, dur: 1300, i: Math.floor(Math.random() * N) };
      nextFidget = time + fidget.dur + 700 + Math.random() * 1500;
    }

    // Tease: one letter unfolds, then maybe up to three of its neighbours along the chain.
    if (teaseQueue) {
      while (teaseQueue.length && time >= teaseQueue[0].at) toResidue(teaseQueue.shift().i);
      if (!teaseQueue.length) teaseQueue = null;
    } else if (!reduce && resting && time - Math.max(restingSince, lastLetterTouch) > (teased ? IDLE_BEFORE_TEASE : FIRST_TEASE) && time >= nextTease) {
      teased = true;
      const count = 1 + Math.floor(Math.random() * 4);
      let i = Math.floor(Math.random() * N), dir = Math.random() < 0.5 ? 1 : -1;
      const picks = [i];
      while (picks.length < count) {
        if (i + dir < 0 || i + dir >= N) { dir = -dir; i = picks[0]; }
        i += dir;
        if (!picks.includes(i)) picks.push(i);
      }
      let at = time;
      teaseQueue = picks.map(i => ({ i, at: (at += picks[0] === i ? 0 : 380 + Math.random() * 300) }));
      fidget = null;
      nextTease = time + 4000 + Math.random() * 4000;
    }
  }

  // Offset of letter i during the current fidget: [dx, dy, rotation].
  function fidgetOffset(i, time) {
    if (!fidget || reduce) return null;
    const since = time - fidget.start;
    if (fidget.type === 'stir') {
      // One letter lifts and trembles; its neighbours feel it through the bond, a little later.
      const dist = Math.abs(i - fidget.i);
      if (dist > 1) return null;
      const lag = dist * 140, amp = dist ? 0.35 : 1;
      const p = (since - lag) / (fidget.dur - 140);
      if (p <= 0 || p >= 1) return null;
      const env = Math.sin(Math.PI * p) * amp;
      return [Math.sin(since * 0.05) * fs * 0.012 * env, -fs * 0.045 * env, Math.sin(since * 0.032) * 0.06 * env];
    }
    // Ripple: a soft wave travels the length of the name.
    const k = fidget.dir > 0 ? i : N - 1 - i;
    const phase = since / fidget.dur * (N + 4) - k;
    if (phase <= 0 || phase >= 4) return null;
    const env = Math.sin(Math.PI * phase / 4);
    return [0, -fs * 0.035 * env, 0.035 * env * fidget.dir * Math.cos(Math.PI * phase / 4)];
  }

  // Drawing
  function frameOf(i) {
    const n = nodes[i], a = nodes[i - 1] || n, b = nodes[i + 1] || n;
    let tx = b.p.x - a.p.x, ty = b.p.y - a.p.y; const tl = Math.hypot(tx, ty);
    if (tl < 1e-3) { tx = 1; ty = 0; } else { tx /= tl; ty /= tl; }
    const side = i % 2 ? 1 : -1;
    return { tx, ty, nx: -ty * side, ny: tx * side };
  }

  function label(text, x, y, color = INK) {
    ctx.font = LABEL; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    const w = ctx.measureText(text).width, h = LABEL_PX * 1.1;
    ctx.fillStyle = PAPER; ctx.fillRect(x - w / 2 - 2, y - h / 2, w + 4, h);
    ctx.fillStyle = color; ctx.fillText(text, x, y);
  }

  function drawResidue(i, e) {
    const n = nodes[i], sc = SC[n.code], { tx, ty, nx, ny } = frameOf(i), s = u * e;
    const P = (x, y) => [n.p.x + (tx * x + nx * y) * s, n.p.y + (ty * x + ny * y) * s];
    ctx.strokeStyle = INK; ctx.lineWidth = Math.max(1, u * 0.055); ctx.lineCap = 'round';
    ctx.globalAlpha = e;
    for (const [ia, ib, d, cx, cy] of sc.b) {
      const A = sc.a[ia], B = sc.a[ib];
      const [x1, y1] = P(A.x, A.y), [x2, y2] = P(B.x, B.y);
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (d) {
        const dx = x2 - x1, dy = y2 - y1, dl = Math.hypot(dx, dy) || 1;
        let ox = -dy / dl, oy = dx / dl;
        if (cx !== undefined) {
          const [ccx, ccy] = P(cx, cy), mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
          if ((ccx - mx) * ox + (ccy - my) * oy < 0) { ox = -ox; oy = -oy; }
        }
        const off = s * 0.15, sh = 0.18;
        ctx.beginPath();
        ctx.moveTo(x1 + dx * sh + ox * off, y1 + dy * sh + oy * off);
        ctx.lineTo(x2 - dx * sh + ox * off, y2 - dy * sh + oy * off);
        ctx.stroke();
      }
    }
    if (e > 0.6) {
      ctx.globalAlpha = (e - 0.6) / 0.4;
      for (const A of sc.a) if (A.l) { const [x, y] = P(A.x, A.y); label(A.l, x, y); }
      label(AA[n.code], n.p.x - nx * u * 0.85, n.p.y - ny * u * 0.85, SOFT);
      if (i === 0) label('H₂N', n.p.x - tx * u * 1.3, n.p.y - ty * u * 1.3);
      if (i === N - 1) label('COOH', n.p.x + tx * u * 1.5, n.p.y + ty * u * 1.5);
    }
    ctx.globalAlpha = e;
    ctx.fillStyle = INK;
    ctx.beginPath(); ctx.arc(n.p.x, n.p.y, Math.max(2.5, u * 0.13), 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  function drawBackbone() {
    ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    const isRes = n => n.t > 0.02;
    let run = [];
    const flush = () => {
      if (run.length > 1) {
        ctx.globalAlpha = run.reduce((s, n) => s + ease(n.t), 0) / run.length;
        ctx.lineWidth = Math.max(1.4, u * 0.08);
        ctx.beginPath(); ctx.moveTo(run[0].p.x, run[0].p.y);
        for (let k = 1; k < run.length - 1; k++) {
          const a = run[k], b = run[k + 1];
          ctx.quadraticCurveTo(a.p.x, a.p.y, (a.p.x + b.p.x) / 2, (a.p.y + b.p.y) / 2);
        }
        const last = run[run.length - 1]; ctx.lineTo(last.p.x, last.p.y); ctx.stroke();
      }
      run = [];
    };
    nodes.forEach(n => { if (isRes(n)) run.push(n); else flush(); });
    flush();
    // Bonds between a residue and a neighbouring letter.
    ctx.lineWidth = 1; ctx.setLineDash([3, 4]);
    for (let i = 0; i < links.length; i++) {
      const a = nodes[i], b = nodes[i + 1];
      if (isRes(a) === isRes(b)) continue;
      const c = isRes(a) ? a : b, o = isRes(a) ? b : a;
      ctx.globalAlpha = 0.55 * ease(c.t);
      ctx.beginPath(); ctx.moveTo(c.p.x, c.p.y); ctx.lineTo(o.p.x, o.p.y); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  function drawLetters(time) {
    ctx.font = font; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK;
    nodes.forEach((n, i) => {
      const e = ease(n.t);
      if (e > 0.98) return;
      let wx = 0, wy = 0, rot = 0, sc = 1 - 0.6 * e;
      if (i === hover && n.mode === 'home' && !reduce) {
        const prog = Math.min(1, (time - hoverStart) / DWELL), amp = prog * prog * fs * 0.035;
        wx = Math.sin(time * 0.045) * amp; wy = Math.cos(time * 0.061) * amp * 0.6; rot = Math.sin(time * 0.03) * prog * prog * 0.06;
      }
      // Always a little life: each letter floats gently, and a soft swell drifts along the name.
      if (n.mode === 'home' && !reduce) {
        const swell = Math.pow(0.5 + 0.5 * Math.sin(time * 0.0009 - i * 0.5), 6);
        wx += Math.sin(time * 0.0013 + i * 2.1) * fs * 0.004;
        wy += Math.sin(time * 0.0017 + i * 1.3) * fs * 0.006 - swell * fs * 0.018 * (0.6 + 0.4 * Math.sin(time * 0.006 + i));
        rot += Math.sin(time * 0.0011 + i * 1.7) * 0.012 + swell * 0.025 * Math.sin(time * 0.004 + i * 2);
      }
      const f = fidgetOffset(i, time);
      if (f) { wx += f[0]; wy += f[1]; rot += f[2]; }
      // A letter popping back in overshoots a little, then settles.
      const since = time - n.popAt;
      if (!reduce && since >= 0 && since < 700) sc *= 1 + 0.09 * Math.sin(since / 700 * Math.PI * 1.5) * (1 - since / 700);
      ctx.save();
      ctx.globalAlpha = 1 - e;
      ctx.translate(n.p.x + wx, n.p.y + wy); ctx.rotate(rot); ctx.scale(sc, sc);
      ctx.fillText(n.ch, n.dx, n.dy);
      ctx.restore();
    });
  }

  function frame(time) {
    step(time);
    ctx.clearRect(0, 0, W, H);
    drawBackbone();
    nodes.forEach((n, i) => { const e = ease(n.t); if (e > 0.01) drawResidue(i, e); });
    drawLetters(time);
    requestAnimationFrame(frame);
  }

  const start = () => {
    layout();
    doc.classList.add('live');
    syncUI();
    requestAnimationFrame(frame);
  };
  addEventListener('resize', layout);
  addEventListener('scroll', layout, { passive: true });
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
})();
</script>
</body>
</html>
